mybatis:
  mapper-locations: classpath:mapper/*.xml

spring:
  main:
    allow-circular-references: true
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
  h2:
    console:
      path: /h2-console/semantic
      # enabled web
      enabled: true
  datasource:
    driver-class-name: org.h2.Driver
    #url: jdbc:h2:mem:semantic;DATABASE_TO_UPPER=false
    url: jdbc:h2:file:./semanticdb;DATABASE_TO_UPPER=false # 关键修改：内存→文件模式
    username: root
    password: semantic
  sql:
    init:
      schema-locations: classpath:db/chat-schema-h2.sql
      data-locations: classpath:db/chat-data-h2.sql

